<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planet Automotive — Daily Closing</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#CC0000; --red-dark:#990000; --red-bg:#ffe6e6;
  --bg:#F0F0F0; --surface:#fff; --surface2:#ececec; --border:#d4d4d4; --border2:#a8a8a8;
  --text:#000; --text2:#4a4a4a; --text3:#808080;
  --ok:#1a6e35; --ok-bg:#dcf5e3; --warn:#8a5a00; --warn-bg:#fff2d6;
  --r:8px; --mono:'IBM Plex Mono',monospace;
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'IBM Plex Sans',sans-serif;background:#000;color:var(--text);font-size:14px;line-height:1.45;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:url('./assets/bg-texture.jpg') center/min(900px,90vw) auto no-repeat fixed;opacity:.45;z-index:0;pointer-events:none;}
body>*{position:relative;z-index:1;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--border2);border-radius:6px;padding:6px 8px;background:#fff;color:var(--text);width:100%;min-width:0;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red);}
input.num{text-align:right;font-family:var(--mono);}
input.auto{color:var(--text3);font-style:italic;}
input.bad{background:var(--red-bg);border-color:var(--red);}

/* TOPBAR */
.topbar{background:#000;color:#F0F0F0;padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:50;border-bottom:2px solid var(--red);}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:54px;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;}
.brand img{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid rgba(204,0,0,.4);}
.brand-name{font-size:15px;font-weight:600;}
.brand-sub{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--red);}
.top-actions{display:flex;gap:8px;align-items:center;}
.pill{background:rgba(255,255,255,.12);border:none;color:#F0F0F0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:500;display:flex;align-items:center;gap:6px;text-decoration:none;}
.pill:hover{background:rgba(255,255,255,.2);}
.dot{width:7px;height:7px;border-radius:50%;background:#888;}
.dot.on{background:#2ecc71;} .dot.off{background:var(--red);}

/* TABS */
.tabs{display:flex;gap:4px;padding:10px max(16px,env(safe-area-inset-left)) 0;max-width:1200px;margin:0 auto;overflow-x:auto;}
.tab{background:rgba(255,255,255,.12);color:#eee;border:none;padding:9px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;white-space:nowrap;}
.tab.active{background:var(--bg);color:#000;}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 90px;}
.page{background:var(--bg);border-radius:0 8px 8px 8px;padding:16px;min-height:60vh;}

/* GENERIC */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.spacer{flex:1;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h3 .spacer{flex:1}
.btn{border:1px solid var(--border2);background:#fff;color:var(--text);padding:7px 12px;border-radius:var(--r);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{background:var(--surface2);}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{background:var(--red-dark);}
.btn.dark{background:#000;border-color:#000;color:#fff;}
.btn.sm{padding:4px 8px;font-size:11px;}
.btn.icon{padding:4px 8px;color:var(--text3);}
.btn.icon:hover{color:var(--red);border-color:var(--red);background:var(--red-bg);}
.muted{color:var(--text3);font-size:12px;}
.mono{font-family:var(--mono);}
.right{text-align:right;}
.neg{color:var(--red);}
.pos{color:var(--ok);}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.datebar input[type=date]{width:auto;font-size:14px;padding:7px 10px;}
.datebar .big{font-size:18px;font-weight:700;}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text2);}
.chip.red{background:var(--red-bg);color:var(--red);}
.chip.ok{background:var(--ok-bg);color:var(--ok);}

/* TICKETS */
.thead,.trow{display:grid;grid-template-columns:28px 92px 170px 82px 82px 74px 64px 86px 86px 120px 140px 30px;gap:6px;align-items:center;}
.thead{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);padding:0 0 6px;}
.trow{padding:6px 0;border-top:1px solid var(--surface2);}
.trow .n{font-size:11px;color:var(--text3);font-family:var(--mono);text-align:center;}
.trow .calc{font-family:var(--mono);font-size:12px;text-align:right;padding-right:4px;}
.trow .calc.total{font-weight:700;}
.trow .lbl{display:none;}
.tscroll{overflow-x:auto;}
.tscroll-inner{min-width:1120px;}
.split{grid-column:3 / -2;display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:6px;background:var(--surface2);padding:6px;border-radius:6px;}
.split label,.field label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px;}
.cost-wrap{position:relative;}
.cost-wrap input{padding-right:18px;}
.cost-wrap .reset{position:absolute;right:2px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text3);font-size:12px;padding:2px 4px;}
.unpaid-flag{font-size:10px;color:var(--red);font-weight:700;}

@media(max-width:820px){
  .tscroll-inner{min-width:0;}
  .thead{display:none;}
  .trow{grid-template-columns:repeat(4,1fr);gap:6px 8px;padding:10px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;background:#fff;}
  .trow .lbl{display:block;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:2px;}
  .trow>.n{grid-column:1 / 4;text-align:left;font-size:12px;font-weight:700;color:var(--text);}
  .trow>.del{grid-column:4;justify-self:end;}
  .trow>.c-inv{grid-column:span 2;} .trow>.c-svc{grid-column:span 2;}
  .trow>.c-pay{grid-column:span 2;} .trow>.c-acct{grid-column:span 2;} .trow>.c-total{grid-column:span 2;}
  .trow .calc{text-align:left;}
  .split{grid-column:1 / -1;grid-template-columns:repeat(2,1fr);}
}

/* TOTALS GRID (like the sheet's DAY TOTALS) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr;}}
table.t{width:100%;border-collapse:collapse;font-size:13px;}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--surface2);}
table.t th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);text-align:left;font-weight:700;}
table.t td.v,table.t th.v{text-align:right;font-family:var(--mono);white-space:nowrap;}
table.t tr.tot td{font-weight:700;border-top:2px solid #000;border-bottom:none;}
table.t tr.sub td{color:var(--text2);}
table.t tr.hl td{background:#fff7f7;}
table.t input{padding:4px 6px;font-size:12px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;border-left:4px solid #000;}
.kpi.red{border-left-color:var(--red);}
.kpi.green{border-left-color:var(--ok);}
.kpi .v{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px;}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);font-weight:600;}
.kpi .s{font-size:11px;color:var(--text2);}
.counter{display:flex;align-items:center;gap:4px;}
.counter button{width:30px;height:30px;border:1px solid var(--border2);background:#fff;border-radius:6px;font-size:16px;font-weight:700;}
.counter input{width:52px;text-align:center;font-family:var(--mono);}
.list-row{display:grid;grid-template-columns:150px 1fr 110px 30px;gap:6px;margin-bottom:6px;align-items:center;}
@media(max-width:600px){.list-row{grid-template-columns:1fr 1fr;}.list-row>*:nth-child(2){grid-column:1 / -1;order:3}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:200;transition:transform .25s;border:1px solid var(--red);max-width:90vw;}
.toast{opacity:0;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media(max-width:600px){.brand-name,.brand-sub,#sync-txt{display:none;}.datebar .big{font-size:15px;width:100%;}}
.note{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:150;padding:16px;}
.modal.show{display:flex;}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;}
.modal h2{font-size:16px;margin-bottom:10px;}

/* REPORT (print) */
#print-area{display:none;}
.rep{font-size:11px;color:#000;}
.rep h1{font-size:18px;margin-bottom:2px;}
.rep h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 4px;border-bottom:2px solid #CC0000;padding-bottom:2px;}
.rep table{width:100%;border-collapse:collapse;}
.rep td,.rep th{border-bottom:1px solid #ddd;padding:3px 5px;text-align:left;}
.rep th{font-size:9px;text-transform:uppercase;color:#555;}
.rep .v{text-align:right;font-family:var(--mono);}
.rep tr.tot td{font-weight:700;border-top:1.5px solid #000;}
.rep .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.rep .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}
.rep .kp div{border:1px solid #ccc;border-left:3px solid #CC0000;padding:4px 6px;}
.rep .kp b{display:block;font-size:14px;font-family:var(--mono);}
@media print{
  @page{size:letter;margin:12mm;}
  body{background:#fff;}
  body::before{display:none;}
  body>*{display:none !important;}
  #print-area{display:block !important;}
  .rep h2{break-after:avoid;}
  .rep table{break-inside:auto;}
  .rep tr{break-inside:avoid;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./index.html">
      <img src="./icons/icon-192.png" alt="">
      <div><div class="brand-name">Planet Automotive</div><div class="brand-sub" data-t="appSub"></div></div>
    </a>
    <div class="top-actions">
      <a class="pill" href="./index.html" data-t="backOrders"></a>
      <button class="pill" onclick="toggleLang()" id="lang-btn">EN</button>
      <span class="pill"><span class="dot" id="sync-dot"></span><span id="sync-txt"></span></span>
    </div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="wrap"><div class="page" id="page"></div></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>
<div id="print-area"></div>
<input type="file" id="file-xls" accept=".xls,.xlsx" style="display:none" onchange="importSheet(this)">
<input type="file" id="file-json" accept=".json,application/json" style="display:none" onchange="importBackup(this)">

<script src="./vendor/xlsx.full.min.js"></script>

   Planet Automotive — Daily Closing (Fechamento diário)
   Replaces the old password-locked "Garage" weekly spreadsheet.
   Same math as the sheet:
     Tax           = Parts × 6.25%  (parts only)
     Total invoice = Labor + Parts + Misc(no tax) + Tax
     Part cost     = service cost (oil changes etc.) + Parts ÷ (1 + markup)
                     — auto, but can be overwritten per ticket
     Inspections   = count × $35, cost count × $12 (kept out of Total invoice,
                     like the sheet, but included in payments)
     Profit (week) = Total invoice + Misc cash in − Part cost − Sales tax
                     − Payroll − Other deductions (labour checks)

let LANG = lsGet('closing_lang') || 'pt';
const t = k => (L[LANG] && L[LANG][k]) || L.en[k] || k;

/* ---------- safe helpers (never throw) ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function num(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v === null || v === undefined) return 0;
  let s = String(v).trim().replace(/[$\s]/g,'');
  if (!s) return 0;
  // "1.234,56" or "12,5" (pt-BR) → dot decimal; "1,234.56" → strip thousands
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (s.includes(',')) s = /,\d{1,2}$/.test(s) ? s.replace(',','.') : s.replace(/,/g,'');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const isBadNum = v => { const s = String(v ?? '').trim(); return s !== '' && !/^-?[$]?\s*[\d.,]+$/.test(s); };
const r2 = n => Math.round((num(n) + Number.EPSILON) * 100) / 100;
const money = n => { const v = r2(n); return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const arr = x => Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === 'object' ? Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(v=>v!=null) : []);
const norm = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g,'');
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2600); }

/* ---------- dates (local, string based: YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dparse = k => { const [y,m,d] = String(k).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (k,n) => { const d = dparse(k); d.setDate(d.getDate()+n); return dkey(d); };
const weekStart = k => { const d = dparse(k); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return dkey(d); }; // Monday
const weekDays = ws => Array.from({length:7},(_,i)=>addDays(ws,i));
const fmtDate = (k,opt) => dparse(k).toLocaleDateString(LANG==='pt'?'pt-BR':'en-US', opt || {weekday:'long', month:'short', day:'numeric', year:'numeric'});
const fmtShort = k => dparse(k).toLocaleDateString(LANG==='pt'?'pt-BR':'en-US',{weekday:'short', month:'2-digit', day:'2-digit'});
const todayKey = () => dkey(new Date());

function S(){ const s = DB.settings || {}; return {
  taxRate: s.taxRate ?? 6.25, markup: s.markup ?? 40, inspPrice: s.inspPrice ?? 35, inspCost: s.inspCost ?? 12,
  services: arr(s.services), accounts: arr(s.accounts), employees: arr(s.employees) }; }

function getDay(k){
  const d = DB.days[k] || {};
  return { tickets: arr(d.tickets).map(normTicket), insp: { cash:num(d.insp?.cash), credit:num(d.insp?.credit), check:num(d.insp?.check), house: arr(d.insp?.house) },
           moves: arr(d.moves), note: d.note || '' };
}
function normTicket(x){ return Object.assign({id:uid(), inv:'', svc:'', ref:'', labor:'', parts:'', misc:'', cost:'', costManual:false, pay:'credit', split:{}, acct:'', note:''}, x, {split: Object.assign({cash:'',credit:'',check:'',house:''}, x.split||{})}); }
function getWeek(ws){ const w = DB.weeks[ws] || {}; return { payroll: arr(w.payroll), deducts: arr(w.deducts), startCash: w.startCash ?? '', cashHave: w.cashHave ?? '', note: w.note || '' }; }

/* ---------- calculations (one place, mirrors the spreadsheet) ---------- */
function svcCost(name, labor){
  const vs = S().services.filter(s => norm(s.name) === norm(name) && norm(name));
  if (!vs.length) return 0;
  const exact = vs.find(s => r2(s.price) === r2(labor));
  if (exact) return num(exact.cost);
  if (vs.length === 1) return num(vs[0].cost);
  return num(vs.slice().sort((a,b)=>Math.abs(num(a.price)-num(labor))-Math.abs(num(b.price)-num(labor)))[0].cost);
}
function isOil(name){ const n = norm(name); if (!n) return false; const v = S().services.find(s => norm(s.name) === n); return v ? !!v.oil : /OIL|SOC|ROC/.test(n); }
function autoCost(tk){ const m = num(S().markup); return r2(svcCost(tk.svc, num(tk.labor)) + num(tk.parts) / (1 + m/100)); }
function calcTicket(tk){
  const labor = num(tk.labor), parts = num(tk.parts), misc = num(tk.misc);
  const tax = parts * num(S().taxRate) / 100;   // not rounded per ticket — same as the sheet
  const total = labor + parts + misc + tax;
  const cost = tk.costManual ? num(tk.cost) : autoCost(tk);
  const p = {cash:0, credit:0, check:0, house:0};
  if (tk.pay === 'split') { for (const k in p) p[k] = num(tk.split[k]); }
  else if (p[tk.pay] !== undefined) p[tk.pay] = total;
  const paid = p.cash + p.credit + p.check + p.house;
  const unpaid = total - paid;
  return { labor, parts, misc, tax, total, cost, p, paid, unpaid: Math.abs(unpaid) < 0.01 ? 0 : unpaid };
}
function calcDay(k){
  const d = getDay(k), s = S();
  const o = { labor:0, parts:0, misc:0, tax:0, total:0, cost:0, unpaid:0, p:{cash:0,credit:0,check:0,house:0},
              invoices:0, oil:0, svc:{}, inspN:0, inspAmt:0, inspCost:0, mv:{miscin:0,partout:0,expense:0,food:0,deposit:0}, collections:0, tickets:d.tickets.length, house:[] };
  d.tickets.forEach(tk => {
    const c = calcTicket(tk);
    o.labor += c.labor; o.parts += c.parts; o.misc += c.misc; o.tax += c.tax; o.total += c.total; o.cost += c.cost; o.unpaid += c.unpaid;
    for (const m in o.p) o.p[m] += c.p[m];
    if (String(tk.inv).trim()) o.invoices++;
    if (isOil(tk.svc)) o.oil++;
    const key = String(tk.svc).trim().toUpperCase() || (String(tk.inv).trim() ? 'INVOICE' : '');
    if (key) { o.svc[key] = o.svc[key] || {n:0, rev:0, cost:0}; o.svc[key].n++; o.svc[key].rev += c.total; o.svc[key].cost += c.cost; }
    if (c.p.house > 0) o.house.push({date:k, acct: tk.acct || '', inv: tk.inv || tk.svc || '', amount: c.p.house, src:'ticket'});
  });
  const ip = num(s.inspPrice), ic = num(s.inspCost);
  const hn = d.insp.house.reduce((a,h)=>a+num(h.n),0);
  o.inspN = d.insp.cash + d.insp.credit + d.insp.check + hn;
  o.inspAmt = o.inspN * ip; o.inspCost = o.inspN * ic;
  o.p.cash += d.insp.cash*ip; o.p.credit += d.insp.credit*ip; o.p.check += d.insp.check*ip; o.p.house += hn*ip;
  d.insp.house.forEach(h => { if (num(h.n)) o.house.push({date:k, acct:h.acct||'', inv:t('insp')+' ×'+num(h.n), amount:num(h.n)*ip, src:'insp'}); });
  d.moves.forEach(m => { if (o.mv[m.type] !== undefined) o.mv[m.type] += num(m.amount); });
  Object.values(DB.house.payments||{}).forEach(p => { if (p && p.date === k && p.type === 'cash') o.collections += num(p.amount); });
  o.paidTotal = o.p.cash + o.p.credit + o.p.check + o.p.house;
  o.gross = o.total - o.tax - o.cost;
  o.cashDelta = o.p.cash + o.collections + o.mv.miscin - o.mv.partout - o.mv.expense - o.mv.food - o.mv.deposit;
  return o;
}
function calcWeek(ws){
  const days = weekDays(ws).map(k => ({k, c: calcDay(k)}));
  const w = getWeek(ws);
  const o = { labor:0, parts:0, misc:0, tax:0, total:0, cost:0, unpaid:0, p:{cash:0,credit:0,check:0,house:0}, invoices:0, oil:0, svc:{}, inspN:0, inspAmt:0, inspCost:0,
              mv:{miscin:0,partout:0,expense:0,food:0,deposit:0}, collections:0, tickets:0, days };
  days.forEach(({c}) => {
    ['labor','parts','misc','tax','total','cost','unpaid','invoices','oil','inspN','inspAmt','inspCost','collections','tickets'].forEach(f => o[f] += c[f]);
    for (const m in o.p) o.p[m] += c.p[m];
    for (const m in o.mv) o.mv[m] += c.mv[m];
    for (const s in c.svc) { o.svc[s] = o.svc[s] || {n:0,rev:0,cost:0}; o.svc[s].n += c.svc[s].n; o.svc[s].rev += c.svc[s].rev; o.svc[s].cost += c.svc[s].cost; }
  });
  o.payroll = w.payroll.reduce((a,p)=>a+num(p.amount),0);
  o.payrollCash = w.payroll.reduce((a,p)=>a+(p.cash?num(p.amount):0),0);
  o.deducts = w.deducts.reduce((a,p)=>a+num(p.amount),0);
  o.profit = o.total + o.mv.miscin - o.cost - o.tax - o.payroll - o.deducts;
  o.inspProfit = o.inspAmt - o.inspCost;
  o.startCash = w.startCash === '' ? defaultStartCash(ws) : num(w.startCash);
  o.startCashAuto = w.startCash === '';
  o.cashShould = o.startCash + o.p.cash + o.mv.miscin + o.collections - o.mv.partout - o.mv.expense - o.mv.food - o.mv.deposit - o.payrollCash;
  o.cashHave = w.cashHave === '' ? null : num(w.cashHave);
  o.diff = o.cashHave === null ? null : o.cashHave - o.cashShould;
  return o;
}
function defaultStartCash(ws){
  const pw = getWeek(addDays(ws,-7));
  return pw.cashHave === '' ? 0 : num(pw.cashHave);
}
/* House charges: every charge (tickets paid "house", house inspections, manual charges) and every payment, per account */
function houseLedger(){
  const charges = [], payments = [];
  Object.keys(DB.days).forEach(k => calcDay(k).house.forEach(h => charges.push(h)));
  Object.entries(DB.house.charges||{}).forEach(([id,c]) => c && charges.push({id, date:c.date, acct:c.acct||'', inv:c.inv||c.desc||'', amount:num(c.amount), src:'manual', desc:c.desc||''}));
  Object.entries(DB.house.payments||{}).forEach(([id,p]) => p && payments.push({id, date:p.date, acct:p.acct||'', amount:num(p.amount), type:p.type||'check', note:p.note||''}));
  return { charges, payments };
}
function houseWeek(ws){
  const we = addDays(ws,6), {charges, payments} = houseLedger();
  const names = new Map();
  const add = n => { const key = norm(n) || '_'; if (!names.has(key)) names.set(key, n || ''); return key; };
  S().accounts.forEach(add); charges.forEach(c=>add(c.acct)); payments.forEach(p=>add(p.acct));
  const rows = [...names.entries()].map(([key,name]) => {
    const ch = charges.filter(c => (norm(c.acct)||'_') === key), py = payments.filter(p => (norm(p.acct)||'_') === key);
    const sum = (a,f) => a.filter(f).reduce((s,x)=>s+x.amount,0);
    const before = sum(ch, c=>c.date < ws) - sum(py, p=>p.date < ws);
    const thisWeek = sum(ch, c=>c.date>=ws && c.date<=we);
    const paid = sum(py, p=>p.date>=ws && p.date<=we);
    const pw = py.filter(p=>p.date>=ws && p.date<=we);
    const after = sum(ch, c=>c.date>we) - sum(py, p=>p.date>we);
    return { key, name, pastDue: before, thisWeek, totalDue: before + thisWeek, paid, outstanding: before + thisWeek - paid, allTime: before + thisWeek - paid + after,
             weekCharges: ch.filter(c=>c.date>=ws && c.date<=we), weekPays: pw, lastPay: pw[pw.length-1] };
  });
  return rows.filter(r => r.key !== '_' || Math.abs(r.allTime) > 0.0099 || r.thisWeek || r.paid);
}

/* ---------- storage / sync ---------- */
const fbUrl = p => `${FB}/closing/${p}.json`;
async function fbGet(p){ const r = await fetch(fbUrl(p)); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fbPut(p, d){ const r = await fetch(fbUrl(p), {method: d===null?'DELETE':'PUT', headers:{'Content-Type':'application/json'}, body: d===null?undefined:JSON.stringify(d)}); if (!r.ok) throw new Error(r.status); }
const pending = new Map(); let saveT = null, editing = 0;
function saveLocal(){ lsSet('autoshop_closing', JSON.stringify(DB)); }
function queue(path){
  pending.set(path, true); saveLocal(); setSync('saving');
  clearTimeout(saveT); saveT = setTimeout(flush, 600);
}
function valueAt(path){ const parts = path.split('/'); let v = DB; for (const p of parts) v = v == null ? undefined : v[p]; return v === undefined ? null : v; }
async function flush(){
  if (!FB) { pending.clear(); setSync('local'); return; }
  const paths = [...pending.keys()]; pending.clear();
  try { for (const p of paths) await fbPut(p, clean(valueAt(p))); setSync('synced'); }
  catch(e){ paths.forEach(p=>pending.set(p,true)); setSync('offline'); clearTimeout(saveT); saveT = setTimeout(flush, 5000); }
}
function clean(v){ return v == null ? null : JSON.parse(JSON.stringify(v)); }
async function pull(){
  if (!FB || pending.size || editing) return;
  try {
    const data = await fbGet('');
    if (pending.size || editing) return;
    const next = mergeRemote(data || {});
    const changed = JSON.stringify(next) !== JSON.stringify(DB);
    DB = next; saveLocal(); setSync('synced');
    if (changed && !document.activeElement?.matches('input,select,textarea')) render();
  } catch(e){ setSync('offline'); }
}
function mergeRemote(d){
  return { settings: Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), d.settings || {}), days: d.days || {}, weeks: d.weeks || {},
           house: { charges: (d.house && d.house.charges) || {}, payments: (d.house && d.house.payments) || {} } };
}
function setSync(st){
  syncState = st;
  const dot = document.getElementById('sync-dot'), tx = document.getElementById('sync-txt');
  dot.className = 'dot ' + (st==='synced'?'on':st==='offline'?'off':'');
  tx.textContent = t(st);
}
async function boot(){
  try { const local = JSON.parse(lsGet('autoshop_closing') || 'null'); if (local) DB = mergeRemote(local); } catch(e){}
  render();
  if (FB) {
    try { const data = await fbGet(''); if (data) { DB = mergeRemote(data); saveLocal(); }
          else if (Object.keys(DB.days).length) { pending.set('settings',1); pending.set('days',1); pending.set('weeks',1); pending.set('house',1); flush(); } // first upload of local data
          setSync('synced'); } catch(e){ setSync('offline'); }
    render();
    setInterval(pull, 8000);
  } else setSync('local');
}
document.addEventListener('focusin', e => { if (e.target.matches('input,select,textarea')) editing++; });
document.addEventListener('focusout', e => { if (e.target.matches('input,select,textarea')) editing = Math.max(0, editing-1); });

/* ---------- mutations ---------- */
function putDay(k, d){ DB.days[k] = { tickets:d.tickets, insp:d.insp, moves:d.moves, note:d.note }; queue('days/'+k); }
function putWeek(ws, w){ DB.weeks[ws] = w; queue('weeks/'+ws); }
function putSettings(s){ DB.settings = s; queue('settings'); }

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById('lang-btn').textContent = LANG === 'pt' ? 'EN' : 'PT';
  const tabs = [['day','tabDay'],['week','tabWeek'],['house','tabHouse'],['set','tabSet']];
  document.getElementById('tabs').innerHTML = tabs.map(([k,l]) => `<button class="tab ${TAB===k?'active':''}" onclick="go('${k}')">${t(l)}</button>`).join('');
  const sy = window.scrollY;
  const page = document.getElementById('page');
  try {
    page.innerHTML = TAB==='day' ? renderDay() : TAB==='week' ? renderWeek() : TAB==='house' ? renderHouse() : renderSettings();
  } catch(e) {
    console.error(e);
    page.innerHTML = `<div class="note">Erro ao montar a tela: ${esc(e.message)}. Seus dados estão salvos — tente recarregar.</div>`;
  }
  window.scrollTo(0, sy);
  setSync(syncState);
}
function renderSoon(){
  setTimeout(() => {
    const page = document.getElementById('page');
    const els = [...page.querySelectorAll('input,select,textarea,button')];
    const idx = els.indexOf(document.activeElement);
    render();
    if (idx >= 0) { const n = page.querySelectorAll('input,select,textarea,button')[idx]; if (n) { n.focus(); if (n.select && n.tagName==='INPUT' && n.type!=='checkbox' && n.type!=='date') try{ n.select(); }catch(e){} } }
  }, 0);
}
function go(k){ TAB = k; lsSet('closing_tab', k); window.scrollTo(0,0); render(); }
function toggleLang(){ LANG = LANG==='pt'?'en':'pt'; lsSet('closing_lang', LANG); render(); }

/* ----- DAY ----- */
function svcOptions(tk){
  const s = S().services, cur = String(tk.svc||'');
  const known = s.some(x => norm(x.name) === norm(cur));
  let h = `<option value="">${t('none')}</option>`;
  const same = s.filter(x => norm(x.name) === norm(cur) && norm(cur));
  const pick = same.find(x => r2(x.price) === r2(num(tk.labor))) || same[0];
  s.forEach(x => { h += `<option value="${esc(x.id)}" ${pick===x?'selected':''}>${esc(x.name)}${num(x.price)?' — '+money(x.price):''}</option>`; });
  if (cur && !known) h += `<option value="__cur" selected>${esc(cur)}</option>`;
  h += `<option value="__custom">${t('custom')}</option>`;
  return h;
}
function acctOptions(cur){
  let h = `<option value="">${t('noAcct')}</option>`;
  const list = S().accounts.slice(); if (cur && !list.some(a=>norm(a)===norm(cur))) list.push(cur);
  list.forEach(a => h += `<option ${norm(a)===norm(cur)?'selected':''}>${esc(a)}</option>`);
  return h;
}
function payOptions(cur){ return ['cash','credit','check','house','split'].map(p=>`<option value="${p}" ${cur===p?'selected':''}>${t(p==='split'?'splitPay':p)}</option>`).join(''); }
function renderTicket(tk, i){
  const c = calcTicket(tk), bad = v => isBadNum(v) ? 'bad' : '';
  const F = (f, ph='') => `<input class="num ${bad(tk[f])}" inputmode="decimal" value="${esc(tk[f])}" placeholder="${ph}" oninput="tkInput(${i},'${f}',this)">`;
  return `<div class="trow" data-i="${i}">
    <div class="n">${i+1}</div>
    <div class="c-inv"><span class="lbl">${t('inv')}</span><input value="${esc(tk.inv)}" placeholder="—" oninput="tkInput(${i},'inv',this)"></div>
    <div class="c-svc"><span class="lbl">${t('svc')}</span><select onchange="tkSvc(${i},this.value)">${svcOptions(tk)}</select></div>
    <div><span class="lbl">${t('labor')}</span>${F('labor','0.00')}</div>
    <div><span class="lbl">${t('parts')}</span>${F('parts','0.00')}</div>
    <div><span class="lbl">${t('misc')}</span>${F('misc','0.00')}</div>
    <div><span class="lbl">${t('tax')}</span><div class="calc" data-f="tax">${money(c.tax)}</div></div>
    <div class="c-total"><span class="lbl">${t('total')}</span><div class="calc total" data-f="total">${money(c.total)}</div></div>

function refreshDayTotals(){

    <tr class="tot"><td>${t('total')}</td><td class="v">${w.tickets}</td><td class="v">${w.invoices}</td><td class="v">${money(w.labor)}</td><td class="v">${money(w.parts)}</td><td class="v">${money(w.tax)}</td><td class="v">${money(w.total)}</td><td class="v">${money(w.cost)}</td><td class="v">${w.inspN}</td><td class="v">${w.oil}</td></tr></table>
  <h2>${t('houseTitle')}</h2>${houseTableHTML(hw)}
  <h2>Tickets</h2>${ticketsTableHTML(tickets)}`;
}
function houseTableHTML(hw){
  const T = hw.reduce((a,r)=>{ ['thisWeek','pastDue','totalDue','paid','outstanding'].forEach(f=>a[f]=(a[f]||0)+r[f]); return a; },{});
  return `<table><tr><th>${t('account')}</th><th class="v">${t('thisWeek')}</th><th class="v">${t('pastDue')}</th><th class="v">${t('totalDue')}</th><th class="v">${t('amtPaid')}</th><th>${t('date')}/${t('payType')}</th><th class="v">${t('outstanding')}</th></tr>
    ${hw.map(r=>`<tr><td>${esc(r.name||t('noAcct'))}</td><td class="v">${money(r.thisWeek)}</td><td class="v">${money(r.pastDue)}</td><td class="v">${money(r.totalDue)}</td><td class="v">${money(r.paid)}</td><td>${r.weekPays.map(p=>esc(fmtDate(p.date,{month:'2-digit',day:'2-digit'}))+' '+t(p.type)).join(', ')}</td><td class="v">${money(r.outstanding)}</td></tr>`).join('')}
    <tr class="tot"><td>Grand total</td><td class="v">${money(T.thisWeek||0)}</td><td class="v">${money(T.pastDue||0)}</td><td class="v">${money(T.totalDue||0)}</td><td class="v">${money(T.paid||0)}</td><td></td><td class="v">${money(T.outstanding||0)}</td></tr></table>`;
}
function ticketsTableHTML(list){
  return `<table><tr><th>${t('day')}</th><th>${t('inv')}</th><th>${t('svc')}</th><th class="v">${t('labor')}</th><th class="v">${t('parts')}</th><th class="v">${t('misc')}</th><th class="v">${t('tax')}</th><th class="v">${t('total')}</th><th class="v">${t('cost')}</th><th>${t('pay')}</th></tr>
    ${list.map(({k,tk,c})=>`<tr><td>${esc(fmtShort(k))}</td><td>${esc(tk.inv)}</td><td>${esc(tk.svc)}</td><td class="v">${money(c.labor)}</td><td class="v">${money(c.parts)}</td><td class="v">${money(c.misc)}</td><td class="v">${money(c.tax)}</td><td class="v">${money(c.total)}</td><td class="v">${money(c.cost)}</td><td>${payLabel(tk,c)}</td></tr>`).join('') || `<tr><td colspan="10">${t('noData')}</td></tr>`}</table>`;
}
function payLabel(tk,c){ const parts = Object.entries(c.p).filter(([,v])=>v).map(([m,v])=> tk.pay==='split' ? `${t(m)} ${money(v)}` : t(m)); let s = parts.join(' + ') || t('unpaid'); if (c.p.house && tk.acct) s += ' · ' + tk.acct; if (c.unpaid>0.0099 && parts.length) s += ` · ${t('unpaid')} ${money(c.unpaid)}`; return esc(s); }
function printWeek(){ doPrint(weekReportHTML(CURW)); }
function printHouse(){ doPrint(repHead(t('houseTitle'), `${fmtDate(CURW)} — ${fmtDate(addDays(CURW,6))}`) + `<h2>${t('houseTitle')}</h2>` + houseTableHTML(houseWeek(CURW))); }
function printDay(){
  const c = calcDay(CUR), d = getDay(CUR);
  const R = (l,v,cls='') => `<tr class="${cls}"><td>${l}</td><td class="v">${money(v)}</td></tr>`;

    <div class="cols"><div><h2>${t('dayTotals')}</h2><table>${R(t('labor'),c.labor)}${R(t('parts'),c.parts)}${R(t('misc'),c.misc)}${R(t('tax'),c.tax)}${R(t('totalInvoice'),c.total,'tot')}${R(t('partCost'),c.cost)}${R(t('grossDay'),c.gross,'tot')}</table></div>
    <div><h2>${t('payments')}</h2><table>${R(t('cash'),c.p.cash)}${R(t('credit'),c.p.credit)}${R(t('check'),c.p.check)}${R(t('house'),c.p.house)}${R(t('unpaidBal'),c.unpaid)}${R(t('inspAmt')+' ('+c.inspN+')',c.inspAmt)}</table>
    <h2>Cash</h2><table>${d.moves.map(m=>R(t('mv_'+m.type)+(m.desc?' — '+esc(m.desc):''),num(m.amount))).join('')}${R(t('collections').split(' (')[0],c.collections)}${R(t('cashToday'),c.cashDelta,'tot')}</table></div></div>
    ${d.note?`<h2>${t('dayNote')}</h2><div>${esc(d.note)}</div>`:''}`);
}

  if (typeof XLSX === 'undefined') { alert('Excel library not loaded'); return; }
  const ws = CURW, w = calcWeek(ws), wk = getWeek(ws), s = S(), r = v => r2(v);

    [t('totalInvoice'), r(w.total)], [t('plusMisc'), r(w.mv.miscin)], [t('minusCost'), -r(w.cost)], [t('minusTax'), -r(w.tax)], [t('minusPay'), -r(w.payroll)], [t('minusDed'), -r(w.deducts)], [t('profit'), r(w.profit)], [],
    [t('invoices'), w.invoices], ['Tickets', w.tickets], [t('oilChanges'), w.oil], [t('inspections'), w.inspN], [t('inspAmt'), r(w.inspAmt)], [t('inspCost'), r(w.inspCost)], [t('inspProfit'), r(w.inspProfit)], [t('profitAll'), r(w.profit + w.inspProfit)], [],
    [t('startCash'), r(w.startCash)], [t('cashShould'), r(w.cashShould)], [t('cashHave'), w.cashHave===null?'':r(w.cashHave)], [t('diff'), w.diff===null?'':r(w.diff)]
  ], [44,16]);
  add(LANG==='pt'?'Por dia':'By day', [[t('day'),'Tickets',t('invoices'),t('labor'),t('parts'),t('misc'),t('tax'),t('totalInvoice'),t('partCost'),t('cash'),t('credit'),t('check'),t('house'),t('unpaid'),t('inspections'),t('oilChanges')],
    ...w.days.map(({k,c})=>[k,c.tickets,c.invoices,r(c.labor),r(c.parts),r(c.misc),r(c.tax),r(c.total),r(c.cost),r(c.p.cash),r(c.p.credit),r(c.p.check),r(c.p.house),r(c.unpaid),c.inspN,c.oil]),
    [t('total'),w.tickets,w.invoices,r(w.labor),r(w.parts),r(w.misc),r(w.tax),r(w.total),r(w.cost),r(w.p.cash),r(w.p.credit),r(w.p.check),r(w.p.house),r(w.unpaid),w.inspN,w.oil]], [12,8,9,11,11,11,10,13,12,11,11,11,11,11,10,10]);
  add('Tickets', [[t('date'),t('inv'),t('svc'),t('labor'),t('parts'),t('misc'),t('tax'),t('total'),t('cost'),t('cash'),t('credit'),t('check'),t('house'),t('acct'),t('unpaid')],
    ...weekDays(ws).flatMap(k => getDay(k).tickets.map(tk => { const c = calcTicket(tk); return [k, tk.inv, tk.svc, r(c.labor), r(c.parts), r(c.misc), r(c.tax), r(c.total), r(c.cost), r(c.p.cash), r(c.p.credit), r(c.p.check), r(c.p.house), tk.acct||'', r(c.unpaid)]; }))], [11,10,14,10,10,10,9,11,11,10,10,10,10,20,10]);
  add(LANG==='pt'?'Serviços':'Services', [[t('svc'),t('qty'),t('revenue'),t('cost')], ...svcRows(w).map(([k,v])=>[k,v.n,r(v.rev),r(v.cost)]), [t('inspections').toUpperCase(), w.inspN, r(w.inspAmt), r(w.inspCost)], [], [t('oilChanges'), w.oil], [t('invoices'), w.invoices]], [22,8,12,12]);
  add('Payroll', [[t('employee'),t('amount'),t('fromCash')], ...wk.payroll.map(p=>[p.name, r(num(p.amount)), p.cash?'X':'']), [t('payroll'), r(w.payroll)], [], [t('deducts')], ...wk.deducts.map(p=>[p.desc, r(num(p.amount)), p.date])], [30,12,12]);
  const hw = houseWeek(ws);
  add('In House', [[t('account'),t('thisWeek'),t('pastDue'),t('totalDue'),t('amtPaid'),t('date')+' / '+t('payType'),t('outstanding')],
    ...hw.map(h=>[h.name||t('noAcct'), r(h.thisWeek), r(h.pastDue), r(h.totalDue), r(h.paid), h.weekPays.map(p=>p.date+' '+t(p.type)).join(', '), r(h.outstanding)]),
    ['GRAND TOTAL', ...['thisWeek','pastDue','totalDue','paid'].map(f=>r(hw.reduce((a,h)=>a+h[f],0))), '', r(hw.reduce((a,h)=>a+h.outstanding,0))], [],
    [t('houseInv')], [t('date'), t('account'), t('inv'), t('amount')], ...hw.flatMap(h=>h.weekCharges.map(c=>[c.date, h.name, c.inv, r(c.amount)]))], [24,14,14,14,14,24,16]);
  add('Cash', [[t('date'),t('desc'),t('amount')], ...weekDays(ws).flatMap(k => getDay(k).moves.map(m => [k, t('mv_'+m.type)+(m.desc?' — '+m.desc:''), r(num(m.amount))])),
    ...Object.values(DB.house.payments||{}).filter(p=>p&&p.type==='cash'&&p.date>=ws&&p.date<=addDays(ws,6)).map(p=>[p.date, 'Collections H.C. — '+(p.acct||''), r(p.amount)])], [12,40,12]);

/* ---------- backup ---------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `planet-closing-backup-${todayKey()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importBackup(inp){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || typeof d !== 'object' || !('days' in d)) throw new Error('formato'); if (!confirm(t('confirmOverwrite'))) return;
    DB = mergeRemote(d); ['settings','days','weeks','house'].forEach(p=>queue(p)); render(); toast('✓ '+t('imported')); } catch(e){ alert('Backup inválido: '+e.message); } };
  rd.readAsText(f);
}

/* ---------- import old spreadsheet (DAY(1)…DAY(7) + TOTALS) ---------- */
function importSheet(inp){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { doImport(XLSX.read(new Uint8Array(rd.result), {type:'array'})); } catch(e){ console.error(e); alert('Não consegui ler a planilha: ' + e.message); } };
  rd.readAsArrayBuffer(f);
}
function doImport(wb){
  const daySheets = wb.SheetNames.filter(n => /^DAY\s*\(\s*\d+\s*\)$/i.test(n.trim()));
  if (!daySheets.length) throw new Error('DAY(1)…DAY(7) não encontradas');
  const V = (sh,a) => { const c = sh[a]; return c ? c.v : undefined; };
  const N = (sh,a) => num(V(sh,a));
  const toKey = v => { if (typeof v === 'number') { const p = XLSX.SSF.parse_date_code(v); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; } if (v instanceof Date) return dkey(v); const d = new Date(v); return isNaN(d) ? null : dkey(d); };
  const cols = 'DEFGHIJKLM'.split(''), mcols = 'DEFGHI'.split(''), pairs = [['D','E'],['F','G'],['H','I'],['J','K'],['L','M'],['N','O']];
  const result = {}; let first = null, payroll = [];
  const s = Object.assign({}, DB.settings, S());
  const ensureAcct = n => { n = String(n||'').trim().toUpperCase(); if (n && n !== '-' && !s.accounts.some(a => norm(a) === norm(n))) s.accounts.push(n); return n; };
  const extraCharges = [];
  daySheets.forEach((name, idx) => {
    const sh = wb.Sheets[name];
    let k = toKey(V(sh,'B2')); if (!k) k = first ? addDays(first, idx) : null; if (!k) return;
    if (!first) first = k;
    const d = { tickets:[], insp:{cash:0,credit:0,check:0,house:[]}, moves:[], note:'' };
    cols.forEach(c => {
      const label = V(sh,c+'5'), labor = N(sh,c+'7'), parts = N(sh,c+'8'), misc = N(sh,c+'9');
      const pc = {cash:N(sh,c+'16'), credit:N(sh,c+'17'), check:N(sh,c+'18'), house:N(sh,c+'19')};
      if (!labor && !parts && !misc && (label === undefined || label === '')) return;
      const lab = String(label ?? '').trim();
      const isInv = /^\d+$/.test(lab);
      const tk = normTicket({ id:uid(), inv: isInv ? lab : '', svc: isInv ? '' : lab.toUpperCase(), ref: V(sh,c+'6') != null ? String(V(sh,c+'6')) : '',
        labor: labor ? String(labor) : '', parts: parts ? String(parts) : '', misc: misc ? String(misc) : '', cost: String(r2(N(sh,c+'14'))), costManual: true });
      const used = Object.entries(pc).filter(([,v]) => v);
      const total = calcTicket(tk).total;
      if (used.length === 1 && Math.abs(used[0][1] - total) < 0.02) tk.pay = used[0][0];
      else { tk.pay = 'split'; for (const m in pc) tk.split[m] = pc[m] ? String(pc[m]) : ''; }
      d.tickets.push(tk);
    });
    d.insp.cash = N(sh,'O5'); d.insp.credit = N(sh,'O7'); d.insp.check = N(sh,'O8');
    if (N(sh,'O9')) d.insp.house.push({acct:'', n:N(sh,'O9')});
    const mrow = {27:'miscin', 29:'partout', 31:'expense'};
    Object.entries(mrow).forEach(([r,type]) => mcols.forEach(c => { const v = N(sh,c+r); if (v) d.moves.push({id:uid(), type, desc:'', amount:String(v)}); }));
    // row 32 = food P.O. amounts (text there = payroll names for row 33)
    mcols.forEach(c => { const v = V(sh,c+'32'); if (typeof v === 'number' && v) d.moves.push({id:uid(), type:'food', desc:'', amount:String(v)}); });
    mcols.forEach(c => { const v = N(sh,c+'33'); if (v) { const nm = V(sh,c+'32'); payroll.push({name: typeof nm === 'string' ? nm.trim().toUpperCase() : 'PAYROLL', amount:v}); } });
    mcols.forEach(c => { const v = N(sh,c+'26'); if (v) extraCharges.push({payment:true, date:k, amount:v}); }); // collections H.C. (cash)
    if (N(sh,'Q5')) d.moves.push({id:uid(), type:'deposit', desc:'', amount:String(N(sh,'Q5'))});
    // house charge table (rows 48–62): account + (invoice #, amount) per slot
    for (let r = 48; r <= 62; r++) {
      const acct = ensureAcct(V(sh,'B'+r)); if (!acct || acct === '-' || acct === '0') continue;
      pairs.forEach(([ci,ca]) => {
        const amt = N(sh,ca+r); if (!amt) return; const invn = String(V(sh,ci+r) ?? '').trim();
        const tk = d.tickets.find(x => !x.acct && calcTicket(x).p.house > 0 && ((invn && String(x.inv) === invn) || Math.abs(calcTicket(x).p.house - amt) < 0.02));
        if (tk) tk.acct = acct; else extraCharges.push({date:k, acct, inv:invn, amount:amt});
      });
    }
    result[k] = d;
  });
  if (!first) throw new Error('datas não encontradas');
  const ws = weekStart(first);
  if (Object.keys(result).some(k => getDay(k).tickets.length) && !confirm(t('confirmOverwrite'))) return;
  Object.entries(result).forEach(([k,d]) => { DB.days[k] = d; queue('days/'+k); });
  // weekly part (TOTALS sheet)
  const tot = wb.Sheets[wb.SheetNames.find(n => /^TOTALS?$/i.test(n.trim()))];
  const wk = getWeek(ws);
  // "TAX" lines in the old payroll row are the sales tax — the new system subtracts tax automatically, so skip them
  wk.payroll = payroll.filter(p => !/^(SALES\s*)?TAX$/.test(p.name)).map(p => ({id:uid(), name:p.name, amount:String(r2(p.amount)), cash:false}));
  if (tot) {
    if (V(tot,'F20') !== undefined) wk.startCash = String(r2(N(tot,'F20')));
    if (V(tot,'F10') !== undefined && V(tot,'F10') !== '') wk.cashHave = String(r2(N(tot,'F10')));
    if (N(tot,'H7')) wk.deducts = [{id:uid(), date:ws, desc:'Labour checks', amount:String(N(tot,'H7'))}];
    for (let r = 56; r <= 70; r++) {
      const acct = ensureAcct(V(tot,'B'+r)); if (!acct || acct === '-' || acct === '0') continue;
      const past = N(tot,'F'+r);
      if (past) {
        // only add the difference not already known from earlier weeks
        const known = houseWeek(ws).find(h => norm(h.name) === norm(acct));
        const diff = r2(past - (known ? known.pastDue : 0));
        if (Math.abs(diff) > 0.0099) extraCharges.push({date:addDays(ws,-1), acct, inv:t('pastDue')+' (import)', amount:diff});
      }
      const paid = N(tot,'J'+r);
      if (paid) { const dv = V(tot,'L'+r); const type = String(V(tot,'N'+r)||'check').toLowerCase(); extraCharges.push({payment:true, date: toKey(dv) || addDays(ws,6), acct, amount:paid, type: /cash/.test(type)?'cash':/card|credit/.test(type)?'credit':'check'}); }
    }
  }
  putWeek(ws, wk);
  extraCharges.forEach(c => { const id = uid(); if (c.payment) { DB.house.payments[id] = {date:c.date, acct:c.acct||'', amount:c.amount, type:c.type||'cash', note:'import'}; queue('house/payments/'+id); }
                              else { DB.house.charges[id] = {date:c.date, acct:c.acct, inv:c.inv, amount:c.amount}; queue('house/charges/'+id); } });
  putSettings(s);
  CUR = first; CURW = ws; go('week');
  toast('✓ ' + t('importDone') + ': ' + Object.keys(result).length + ' dias');
}

boot();
</script>
